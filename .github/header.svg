<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Artemeon ORM — attribute-driven Data Mapper for PHP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1c1f45"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#777bb4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#777bb4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b4b8f0"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#2dd4bf"/>
    </marker>
  </defs>

  <rect width="1280" height="360" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="16" fill="url(#dots)"/>
  <rect width="1280" height="360" rx="16" fill="url(#glow)"/>

  <!-- Title block -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" fill="#2dd4bf" letter-spacing="1">artemeon/orm</text>
    <text x="68" y="196" font-size="104" font-weight="800" fill="url(#title)" letter-spacing="-2">ORM</text>
    <text x="72" y="240" font-size="26" fill="#c9cbe8">Attribute-driven Data Mapper for PHP</text>
  </g>
  <g transform="translate(72 268)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <rect width="390" height="36" rx="8" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="16" y="23" fill="#8b8fd6">#[<tspan fill="#f0c674">TableColumn</tspan>(<tspan fill="#a5e8a0">'owner'</tspan>, <tspan fill="#c9cbe8">DataType::CHAR20</tspan>)]</text>
  </g>

  <!-- Diagram: entity -> tables -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
    <!-- Entity class -->
    <g transform="translate(660 92)">
      <rect width="210" height="176" rx="12" fill="#151936" stroke="#777bb4" stroke-width="1.5"/>
      <path d="M12 0h186a12 12 0 0 1 12 12v28H0V12A12 12 0 0 1 12 0z" fill="#777bb4"/>
      <text x="16" y="26" fill="#ffffff" font-weight="700">class TestModel</text>
      <text x="16" y="66" fill="#8b8fd6">#[TablePrimary]</text>
      <text x="16" y="86" fill="#c9cbe8">$contractId</text>
      <text x="16" y="114" fill="#8b8fd6">#[TableColumn]</text>
      <text x="16" y="134" fill="#c9cbe8">$servicerId</text>
      <text x="16" y="160" fill="#6b6fa8">extends TestParent</text>
    </g>

    <!-- Arrows -->
    <path d="M876 150 C 930 150, 930 100, 976 100" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M876 210 C 930 210, 930 252, 976 252" fill="none" stroke="#2dd4bf" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Parent table -->
    <g transform="translate(984 48)">
      <rect width="232" height="108" rx="12" fill="#151936" stroke="#2dd4bf" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="16" y="28" fill="#2dd4bf" font-weight="700">entities</text>
      <line x1="0" y1="42" x2="232" y2="42" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="16" y="68" fill="#f0c674">🔑 system_id</text>
      <text x="44" y="92" fill="#c9cbe8">owner</text>
    </g>

    <!-- JOIN pill -->
    <g transform="translate(1100 156)">
      <line x1="0" y1="0" x2="0" y2="40" stroke="#ffffff" stroke-opacity="0.3" stroke-dasharray="4 4"/>
      <rect x="-30" y="8" width="60" height="24" rx="12" fill="#2dd4bf"/>
      <text x="0" y="25" fill="#0b1020" font-weight="700" text-anchor="middle">JOIN</text>
    </g>

    <!-- Child table -->
    <g transform="translate(984 196)">
      <rect width="232" height="116" rx="12" fill="#151936" stroke="#2dd4bf" stroke-opacity="0.6" stroke-width="1.5"/>
      <text x="16" y="28" fill="#2dd4bf" font-weight="700">contracts</text>
      <line x1="0" y1="42" x2="232" y2="42" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="16" y="68" fill="#f0c674">🔑 contract_id</text>
      <text x="44" y="94" fill="#c9cbe8">servicerid</text>
    </g>
  </g>
</svg>
